<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCIENTIFIC CALCULATOR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <section class="display">
            <span class="display-value">0</span>
        </section>
            <div class="keypad">
                <button class="black operator" value="button" aria-label="clear">AC</button>
                <button class="black dark" value="button" aria-label="double zero">00</button>
                <button class="black dark" value="button" aria-label="percentage">%</button>
                <button class="black orange" value="button" aria-label="division">÷</button>
                <button class="black dark" value="button">7</button>
                <button class="black dark" value="button">8</button>
                <button class="black dark" value="button">9</button>
                <button class="black orange" value="button" aria-label="multiplication">x</button>

                <button class="black dark" value="button">4</button>
                <button  class="black dark"value=button">5</button>
                <button  class="black dark" value="button">6</button>
                <button class="black orange" value="button" aria-label="subtraction">-</button>

                <button class="black dark" value="button">1</button>
                <button class="black dark" value="button">2</button>
                <button class="black dark" value="button">3</button>
                <button class="black orange" value="button" aria-label="addition">+</button>

                <button class="black dark zero" value="button">0</button>
                <button class="black dark" value="button">.</button>
                <button class="black orange" value="button" aria-label="equals">=</button>
            </div>

    </div>
</body>
</html>
